[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "distance-measuring"
version = "0.1.0"
description = "Offline sparse reconstruction and distance measurement from phone captures."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "pandas",
    "pyyaml",
    "open3d",
    "matplotlib",
    "pytest",
]

[project.optional-dependencies]
dev = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"distance_measuring.visualization" = ["web_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
